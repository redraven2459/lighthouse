[project]
name = "lighthouse_server"
version = "0.1.0"
dependencies = ["fastapi[standard]==0.139.2", "requests==2.34.2", "sqlmodel==0.0.39", "alembic==1.18.5", "tidekeeper==2026.8.16.0"]
requires-python = ">= 3.8"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
